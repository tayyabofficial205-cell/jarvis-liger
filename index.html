<style>
:root{--bg:#02050a;--cy:#00e5ff;--sky:#38bdf8;--gr:#10b981;--tx:#e8f4fc;--mu:#8ba3bd;--ln:rgba(0,229,255,.15);--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(42% 35% at 15% 18%,rgba(0,229,255,.16),transparent 70%),radial-gradient(38% 32% at 85% 25%,rgba(16,185,129,.14),transparent 70%),radial-gradient(45% 35% at 50% 85%,rgba(56,189,248,.12),transparent 70%);animation:aurora 20s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(4%,3%,0) scale(1.07)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
.strip{position:relative;z-index:20;text-align:center;padding:10px 16px;font-size:.85rem;font-weight:600;color:#cffafe;background:linear-gradient(90deg,transparent,rgba(6,78,59,.65),rgba(14,116,144,.65),transparent);border-bottom:1px solid rgba(0,229,255,.25)}
.strip b{color:var(--gold)}
.nav-wrap{position:sticky;top:12px;z-index:50;display:flex;justify-content:center;padding:0 14px;margin-top:12px}
.nav{width:100%;max-width:1160px;display:flex;align-items:center;justify-content:space-between;padding:9px 12px 9px 22px;border-radius:999px;background:rgba(5,11,20,.82);backdrop-filter:blur(18px);border:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;font-weight:900;color:#fff;text-decoration:none;letter-spacing:1px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 14px var(--cy)}
.links{display:flex;gap:20px}.links a{color:#cbd5e1;text-decoration:none;font-size:.86rem;font-weight:500}.links a:hover{color:var(--cy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn-w{background:linear-gradient(135deg,#00e5ff,#10b981);color:#02050a;padding:12px 24px;box-shadow:0 0 28px rgba(0,229,255,.35)}.btn-w:hover{transform:translateY(-2px);box-shadow:0 0 42px rgba(0,229,255,.65)}
.btn-d{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18);padding:13px 26px}.btn-d:hover{background:rgba(255,255,255,.12);border-color:var(--cy)}
.btn-big{padding:16px 34px;font-size:1.02rem}
section,.hero{position:relative;z-index:10}
section.blk{max-width:1160px;margin:0 auto;padding:82px 20px}
.eyebrow{text-align:center;color:var(--cy);font-size:.76rem;font-weight:700;letter-spacing:3px;margin-bottom:10px;text-transform:uppercase}
h2{text-align:center;font-size:clamp(1.9rem,4vw,2.85rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:14px}
.lead{text-align:center;color:var(--mu);max-width:650px;margin:0 auto 44px;font-size:1.03rem}
.glass{background:rgba(8,16,28,.72);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:22px}
/* Hero */
.hero{max-width:1200px;margin:0 auto;padding:48px 20px 80px;display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;font-size:.78rem;font-weight:700;color:#6ee7b7;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);margin-bottom:18px}
.badge i{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 10px #10b981}
h1{font-size:clamp(2.3rem,5vw,4rem);font-weight:800;line-height:1.07;letter-spacing:-.03em;margin-bottom:18px;background:linear-gradient(180deg,#fff 35%,#94a3b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 em{font-style:normal;background:linear-gradient(90deg,#00e5ff,#38bdf8,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mu);font-size:1.1rem;max-width:530px;margin-bottom:28px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.meta{margin-top:18px;font-size:.84rem;color:#7dd3fc;display:flex;gap:16px;flex-wrap:wrap}
.meta span::before{content:"✓ ";color:#10b981;font-weight:800}
#toast{display:none;margin-top:16px;max-width:530px;padding:12px 18px;border-radius:14px;background:rgba(16,185,129,.14);border:1px solid #10b981;color:#a7f3d0;font-weight:600}
.hero-shot{position:relative;border-radius:20px;padding:8px;background:linear-gradient(145deg,rgba(0,229,255,.45),rgba(16,185,129,.25),rgba(7,18,34,.9));box-shadow:0 24px 70px rgba(0,229,255,.24);cursor:zoom-in}
.hero-shot img{width:100%;border-radius:14px;display:block;border:1px solid rgba(0,229,255,.35)}
.hero-shot .tag{position:absolute;bottom:16px;left:16px;padding:6px 14px;border-radius:999px;background:rgba(2,6,13,.88);border:1px solid var(--cy);color:var(--cy);font-size:.75rem;font-weight:700}
/* Stats */
.stats{max-width:1100px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:22px 14px;text-align:center}.stat b{display:block;font-family:'Orbitron';font-size:1.65rem;color:var(--cy)}.stat span{font-size:.82rem;color:var(--mu)}
/* Grids */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.card{padding:24px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:var(--cy)}
.card h3{font-size:1.05rem;margin:10px 0 6px;color:#fff}.card p{font-size:.89rem;color:var(--mu)}
.ico{font-size:1.5rem}
/* Cockpit Hotspots */
.cockpit-box{position:relative;padding:18px;border-radius:24px}
.cockpit-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--cy);box-shadow:0 20px 65px rgba(0,229,255,.22)}
.cockpit-wrap img{width:100%;display:block}
.spot{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(0,229,255,.25);border:2px solid var(--cy);cursor:pointer;transform:translate(-50%,-50%);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,255,.7)}70%{box-shadow:0 0 0 14px rgba(0,229,255,0)}100%{box-shadow:0 0 0 0 rgba(0,229,255,0)}}
.spot-tip{margin-top:14px;padding:12px 18px;border-radius:12px;background:rgba(0,229,255,.08);border:1px solid var(--ln);color:#cffafe;font-size:.9rem;text-align:center}
/* Interactive Demo Terminal */
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:rgba(0,229,255,.08);border:1px solid var(--ln);color:#cffafe;font-size:.84rem;font-weight:600;cursor:pointer}.chip:hover{border-color:var(--cy);background:rgba(0,229,255,.18)}
.term{padding:22px;font-family:Consolas,monospace;font-size:.9rem;background:#030914;border:1px solid var(--cy);border-radius:18px;min-height:140px;color:#6ee7b7;white-space:pre-line}
/* Tools pills */
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.pill-cmd{padding:8px 16px;border-radius:12px;background:rgba(7,18,34,.9);border:1px solid var(--ln);color:var(--cy);font-family:Consolas,monospace;font-weight:700;font-size:.88rem}
/* FAQ */
details{padding:18px 22px;margin-bottom:12px;cursor:pointer}
summary{font-weight:700;color:#fff;font-size:1rem;list-style:none}
details p{margin-top:10px;color:var(--mu);font-size:.92rem}
/* Sticky & Modal */
